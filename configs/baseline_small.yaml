name: baseline_small

model:
  vocab_size: 50257   # gpt2 tokenizer
  dim: 256
  n_layers: 6
  n_heads: 8
  n_kv_heads: 8
  max_seq_len: 512
  dropout: 0.0
  rope_theta: 10000.0
  tie_embeddings: true

data:
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  tokenizer_name: gpt2
  cache_dir: /content/drive/MyDrive/adaptive-finance-llm/data
  seq_len: 512
  num_workers: 2

train:
  batch_size: 16
  grad_accum_steps: 2
  max_steps: 500
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 100
  eval_steps: 50
  checkpoint_interval: 100
  checkpoint_dir: /content/drive/MyDrive/adaptive-finance-llm/checkpoints
  log_dir: /content/drive/MyDrive/adaptive-finance-llm/logs
  seed: 1337
  amp: true
  device: cuda
  resume: true
